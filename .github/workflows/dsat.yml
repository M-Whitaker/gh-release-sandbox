name: DSAT - Dynamic Security Testing

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  dsat-security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
    
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
    
      - name: Build Spring Boot application
        run: mvn clean package -DskipTests
    
      - name: Start Spring Boot application
        run: |
          java -jar target/*.jar &
          echo $! > app.pid
          echo "Waiting for application to start..."
          sleep 30
          # Health check
          timeout 60 bash -c 'until curl -f http://localhost:8080/actuator/health || curl -f http://localhost:8080; do sleep 2; done' || {
            echo "Application failed to start"
            exit 1
          }
          echo "Application started successfully"
    
      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: 'example-api.yaml'
          format: openapi
          artifact_name: zap-scan
          cmd_options: '-a'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
    
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false
    
      - name: Stop Spring Boot application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
            rm app.pid
          fi
    
      - name: Upload ZAP Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-results
          path: |
            report_html.html
            report_md.md
            report_json.json
    
      - name: Create Security Report Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🔒 DSAT Security Scan Results\n\n';
            
            try {
              if (fs.existsSync('report_md.md')) {
                const report = fs.readFileSync('report_md.md', 'utf8');
                comment += report;
              } else {
                comment += 'No security issues detected! ✅';
              }
            } catch (error) {
              comment += 'Error reading scan results.';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
    
      - name: Check for High/Medium Vulnerabilities
        if: always()
        run: |
          if [ -f report_json.json ]; then
            HIGH=$(jq '[.site[].alerts[] | select(.riskcode=="3")] | length' report_json.json || echo "0")
            MEDIUM=$(jq '[.site[].alerts[] | select(.riskcode=="2")] | length' report_json.json || echo "0")
            
            echo "High severity issues: $HIGH"
            echo "Medium severity issues: $MEDIUM"
            
            if [ "$HIGH" -gt "0" ]; then
              echo "❌ DSAT Failed: $HIGH high severity vulnerabilities found"
              exit 1
            fi
            
            if [ "$MEDIUM" -gt "5" ]; then
              echo "⚠️  Warning: $MEDIUM medium severity vulnerabilities found (threshold: 5)"
              exit 1
            fi
            
            echo "✅ DSAT Passed: No critical vulnerabilities detected"
          fi
